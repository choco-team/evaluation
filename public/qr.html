<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>평가답안지 QR코드</title>
</head>
<body>
  <canvas id="qr"></canvas>

  <!-- URL 복사 버튼 추가 -->
  <div style="margin-top: 10px;">
    <button id="copy-btn">URL 복사</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
  <script>
    let currentUrl = ''; // 전역 변수로 url 저장

    window.electronAPI.on('exam-data', ({ url, endpoint }) => {
      console.log('받은 URL:', url);
      console.log('받은 Endpoint:', endpoint);

      currentUrl = url; // 받은 url 저장

      // QR코드 렌더링
      QRCode.toCanvas(document.getElementById('qr'), url, { width: 200 }, function (error) {
        if (error) console.error('QR 생성 오류:', error);
      });

      // SSE 연결
      const eventSource = new EventSource(endpoint);

      eventSource.onmessage = (event) => {
        console.log('SSE 데이터 수신:', event.data);
        window.electronAPI.send('answer-data', event.data);
      };

      eventSource.onerror = (err) => {
        console.error('SSE 오류:', err);
        // setTimeout(() => {
        //   eventSource.close();
        //   window.close();
        // }, 1000);
      };
    });

    // 복사 버튼 이벤트 등록
    document.getElementById('copy-btn').addEventListener('click', () => {
      if (!currentUrl) {
        console.warn('복사할 URL이 없습니다.');
        return;
      }

      navigator.clipboard.writeText(currentUrl)
        .then(() => {
          console.log('URL 복사 성공:', currentUrl);
          alert('URL이 복사되었습니다!');
        })
        .catch((err) => {
          console.error('URL 복사 실패:', err);
        });
    });
  </script>
</body>
</html>
